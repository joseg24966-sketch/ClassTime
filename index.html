
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassTime</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #10131c;
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  max-width: 520px;
  margin: 20px auto;
}

h1 { color: #a78bfa; }

.card {
  background: #202535;
  padding: 20px;
  border-radius: 16px;
  margin: 15px 0;
}

.muted { color: #aab1c3; }

#clock {
  font-size: 28px;
}

#countdown {
  font-size: 40px;
  font-weight: bold;
  color: #a78bfa;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border-radius: 9px;
  border: none;
  font-size: 15px;
}

input, select {
  background: #343c50;
  color: white;
}

button {
  background: #a78bfa;
  color: #10131c;
  font-weight: bold;
  cursor: pointer;
}

button.secondary {
  background: #41485a;
  color: white;
}

button.small {
  width: auto;
  padding: 7px 10px;
  margin: 4px;
}

.class {
  padding: 12px 0;
  border-bottom: 1px solid #41485a;
}

.class-actions {
  display: flex;
  gap: 5px;
  margin-top: 6px;
}

.class-actions button {
  width: auto;
  flex: 1;
}

.status {
  color: #a78bfa;
  font-size: 14px;
}

label {
  display: block;
  margin-top: 10px;
  color: #aab1c3;
}

</style>
  <link rel="manifest" href="manifest.json">
</head>

<body>
<div class="app">

<h1>ClassTime</h1>
<p class="muted">Your school day, under control.</p>

<div class="card">
  <p class="muted">CURRENT TIME</p>
  <h2 id="clock">--:--:--</h2>
  <p id="todayLabel" class="muted"></p>
</div>

<div class="card">
  <p class="muted">YOUR NEXT CLASS</p>
  <h2 id="nextClass">No upcoming class</h2>
  <p id="room" class="muted"></p>
  <p id="startTime"></p>
  <p class="muted">TIME UNTIL CLASS</p>
  <div id="countdown">--:--:--</div>
  <p id="passing" class="status"></p>
</div>

<div class="card">
  <h3>Weekly Schedule</h3>

  <label for="viewDay">Choose a day:</label>
  <select id="viewDay">
    <option value="1">Monday</option>
    <option value="2">Tuesday</option>
    <option value="3">Wednesday</option>
    <option value="4">Thursday</option>
    <option value="5">Friday</option>
    <option value="6">Saturday</option>
    <option value="0">Sunday</option>
  </select>

  <div id="schedule"></div>
</div>

<div class="card">
  <h3 id="formTitle">Add a Class</h3>

  <label for="classDay">Day:</label>
  <select id="classDay">
    <option value="1">Monday</option>
    <option value="2">Tuesday</option>
    <option value="3">Wednesday</option>
    <option value="4">Thursday</option>
    <option value="5">Friday</option>
    <option value="6">Saturday</option>
    <option value="0">Sunday</option>
  </select>

  <label for="className">Class name:</label>
  <input id="className" placeholder="Example: English">

  <label for="classRoom">Classroom:</label>
  <input id="classRoom" placeholder="Example: 204">

  <label for="classStart">Starting time:</label>
  <input type="time" id="classStart">

  <label for="classEnd">Ending time:</label>
  <input type="time" id="classEnd">

  <button id="saveButton">Add Class</button>
  <button id="cancelButton" class="secondary" hidden>
    Cancel Editing
  </button>
  <p id="message" class="status"></p>
</div>

<div class="card">
  <h3>Reminders</h3>
  <p class="muted">
    Get browser notifications 5 minutes and 2 minutes
    before your classes. Keep this page open.
  </p>
  <button id="notificationButton">
    Enable Notifications
  </button>
  <p id="notificationStatus" class="status"></p>
</div>

</div>

<script>
const days = [
  "Sunday", "Monday", "Tuesday", "Wednesday",
  "Thursday", "Friday", "Saturday"
];

let classes = [];

try {
  classes = JSON.parse(
    localStorage.getItem("classTimeSchedule") || "[]"
  );

  if (!Array.isArray(classes)) classes = [];
} catch {
  classes = [];
}

let editingId = null;
const firedReminders = new Set();

const $ = id => document.getElementById(id);

function saveClasses() {
  localStorage.setItem(
    "classTimeSchedule",
    JSON.stringify(classes)
  );
}

function dateForClass(c) {
  const [h, m] = c.start.split(":").map(Number);
  const date = new Date();
  date.setHours(h, m, 0, 0);
  return date;
}

function dateForEnd(c) {
  const [h, m] = c.end.split(":").map(Number);
  const date = new Date();
  date.setHours(h, m, 0, 0);
  return date;
}

function formatTime(time) {
  const [h, m] = time.split(":").map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d.toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });
}

function countdownText(total) {
  const seconds = Math.max(0, Math.floor(total / 1000));
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;

  return [h, m, s]
    .map(n => String(n).padStart(2, "0"))
    .join(":");
}

function getTodayClasses() {
  const day = new Date().getDay();

  return classes
    .filter(c => Number(c.day) === day)
    .sort((a, b) => a.start.localeCompare(b.start));
}

function updateApp() {
  const now = new Date();

  $("clock").textContent = now.toLocaleTimeString();
  $("todayLabel").textContent =
    now.toLocaleDateString([], {
      weekday: "long",
      month: "long",
      day: "numeric"
    });

  const today = getTodayClasses();

  const next = today.find(c => dateForClass(c) > now);
  const current = today.find(c =>
    dateForClass(c) <= now && dateForEnd(c) > now
  );

  if (next) {
    $("nextClass").textContent = next.name;
    $("room").textContent = "Room: " + next.room;
    $("startTime").textContent =
      "Starts at " + formatTime(next.start);
    $("countdown").textContent =
      countdownText(dateForClass(next) - now);

    if (current) {
      $("passing").textContent =
        "You have " +
        countdownText(dateForClass(next) - now) +
        " until your next class. Current: " + current.name;
    } else {
      $("passing").textContent = "";
    }
  } else {
    $("nextClass").textContent =
      current ? current.name + " (in progress)" :
      "No upcoming classes!";
    $("room").textContent =
      current ? "Room: " + current.room : "";
    $("startTime").textContent = "";
    $("countdown").textContent =
      current ? countdownText(dateForEnd(current) - now) :
      "🎉";
    $("passing").textContent =
      current ? "Time remaining in this class" :
      "Enjoy your free time!";
  }

  renderSchedule();
  checkReminders(today, now);
}

function renderSchedule() {
  const day = Number($("viewDay").value);

  const list = classes
    .filter(c => Number(c.day) === day)
    .sort((a, b) => a.start.localeCompare(b.start));

  const container = $("schedule");
  container.replaceChildren();

  if (!list.length) {
    const empty = document.createElement("p");
    empty.className = "muted";
    empty.textContent = "No classes added for this day yet.";
    container.appendChild(empty);
    return;
  }

  list.forEach(c => {
    const item = document.createElement("div");
    item.className = "class";

    const title = document.createElement("strong");
    title.textContent = c.name;

    const details = document.createElement("p");
    details.className = "muted";
    details.textContent =
      formatTime(c.start) + " – " + formatTime(c.end) +
      " · Room " + c.room;

    const actions = document.createElement("div");
    actions.className = "class-actions";

    const edit = document.createElement("button");
    edit.className = "secondary";
    edit.textContent = "Edit";
    edit.addEventListener("click", () => editClass(c.id));

    const remove = document.createElement("button");
    remove.className = "secondary";
    remove.textContent = "Delete";
    remove.addEventListener("click", () => deleteClass(c.id));

    actions.append(edit, remove);
    item.append(title, details, actions);
    container.appendChild(item);
  });
}

function addOrUpdateClass() {
  const day = $("classDay").value;
  const name = $("className").value.trim();
  const room = $("classRoom").value.trim() || "Not entered";
  const start = $("classStart").value;
  const end = $("classEnd").value;

  if (!name || !start || !end) {
    $("message").textContent =
      "Please enter a class name, start time, and end time.";
    return;
  }

  if (end <= start) {
    $("message").textContent =
      "Ending time must be later than starting time.";
    return;
  }

  const conflict = classes.some(c =>
    c.id !== editingId &&
    Number(c.day) === Number(day) &&
    start < c.end && end > c.start
  );

  if (conflict) {
    $("message").textContent =
      "Those times overlap another class on that day.";
    return;
  }

  if (editingId !== null) {
    const old = classes.find(c => c.id === editingId);
    if (old) Object.assign(old, { day, name, room, start, end });
  } else {
    classes.push({
      id: Date.now().toString() + Math.random().toString(16).slice(2),
      day, name, room, start, end
    });
  }

  saveClasses();
  resetForm();
  $("viewDay").value = day;
  updateApp();
}

function editClass(id) {
  const c = classes.find(item => item.id === id);
  if (!c) return;

  editingId = id;
  $("classDay").value = c.day;
  $("className").value = c.name;
  $("classRoom").value = c.room;
  $("classStart").value = c.start;
  $("classEnd").value = c.end;
  $("formTitle").textContent = "Edit Class";
  $("saveButton").textContent = "Save Changes";
  $("cancelButton").hidden = false;
  $("message").textContent = "Editing " + c.name;
}

function deleteClass(id) {
  if (!confirm("Delete this class?")) return;

  classes = classes.filter(c => c.id !== id);
  saveClasses();

  if (editingId === id) resetForm();

  updateApp();
}

function resetForm() {
  editingId = null;
  $("className").value = "";
  $("classRoom").value = "";
  $("classStart").value = "";
  $("classEnd").value = "";
  $("formTitle").textContent = "Add a Class";
  $("saveButton").textContent = "Add Class";
  $("cancelButton").hidden = true;
  $("message").textContent = "";
}

function checkReminders(today, now) {
  if (!("Notification" in window) ||
      Notification.permission !== "granted") return;

  today.forEach(c => {
    const minutes = Math.ceil((dateForClass(c) - now) / 60000);

    if (minutes === 5 || minutes === 2) {
      const key = c.id + "-" + now.toDateString() + "-" + minutes;

      if (firedReminders.has(key)) return;
      firedReminders.add(key);

      new Notification("ClassTime: " + c.name, {
        body: "Your class starts in " + minutes +
          " minutes. Room: " + c.room
      });

      if ("vibrate" in navigator) {
        navigator.vibrate([200, 100, 200]);
      }
    }
  });
}

$("saveButton").addEventListener("click", addOrUpdateClass);
$("cancelButton").addEventListener("click", resetForm);
$("viewDay").addEventListener("change", renderSchedule);

$("notificationButton").addEventListener("click", async () => {
  if (!("Notification" in window)) {
    $("notificationStatus").textContent =
      "Notifications are not supported by this browser.";
    return;
  }

  const permission = await Notification.requestPermission();

  $("notificationStatus").textContent =
    permission === "granted"
      ? "Notifications enabled! Keep this page open."
      : "Notifications were not enabled.";
});

const todayNumber = new Date().getDay();
$("viewDay").value = todayNumber;
$("classDay").value = todayNumber;

updateApp();
setInterval(updateApp, 1000);
</script>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(() => console.log("ClassTime is ready!"))
      .catch(error => console.log("Service worker error:", error));
  });
}
</script>
</body>
</html>
